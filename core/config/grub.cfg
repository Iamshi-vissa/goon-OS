# Goon OS Core boot menu (BIOS and UEFI)
serial --unit=0 --speed=115200
terminal_input  console serial
terminal_output console serial
set timeout=5
set default=0
set color_normal=light-gray/black
set color_highlight=white/magenta
set menu_color_normal=light-gray/black
set menu_color_highlight=white/magenta

insmod all_video
set gfxpayload=keep

menuentry "Goon OS Core @VERSION@" {
	linux  /boot/vmlinuz quiet loglevel=3 console=ttyS0,115200 console=tty0
	initrd /boot/initramfs.img
}
menuentry "Goon OS Core @VERSION@ (show boot messages)" {
	linux  /boot/vmlinuz loglevel=7 console=ttyS0,115200 console=tty0
	initrd /boot/initramfs.img
}
menuentry "Goon OS Core @VERSION@ (safe graphics)" {
	linux  /boot/vmlinuz quiet loglevel=3 nomodeset vga=normal console=ttyS0,115200 console=tty0
	initrd /boot/initramfs.img
}
menuentry "Reboot"    { reboot }
menuentry "Power off" { halt }
