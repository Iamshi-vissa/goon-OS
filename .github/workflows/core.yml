name: Goon OS Core

on:
  push:
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  workflow_dispatch:

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev cpio \
            xz-utils bzip2 grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            qemu-system-x86 ovmf expect fdisk shellcheck

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Lint
        run: |
          shellcheck -S warning build.sh scripts/*.sh
          shellcheck -S warning -s sh rootfs/etc/init.d/* rootfs/sbin/goon-* rootfs/usr/bin/goon*

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: core/downloads
          key: sources-${{ hashFiles('core/build.sh') }}

      - name: Build
        run: ./build.sh

      - name: Boot test (BIOS)
        run: ./scripts/smoke-test.exp out/goon-os-core-*.iso bios
      - name: Boot test (UEFI)
        run: ./scripts/smoke-test.exp out/goon-os-core-*.iso uefi
      - name: Persistence test
        run: ./scripts/persist-test.exp out/goon-os-core-*.iso

      - uses: actions/upload-artifact@v4
        with:
          name: goon-os-core-iso
          path: core/out/*
